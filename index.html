<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Umut Yanardağ | Web Tasarım Uzmanı</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F4F5FA;
    --surface:#FFFFFF;
    --surface-2:#ECEEF7;
    --border:#DDE1EE;
    --text:#161A2B;
    --muted:#666E85;
    --blue:#5A4FE0;
    --blue-soft:rgba(90,79,224,.12);
    --whatsapp:#22C55E;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'IBM Plex Sans', sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:64px 24px;
    position:relative;
    overflow:hidden;
  }

  /* ---------- futuristic background layer ---------- */
  .hero-bg{
    position:absolute;
    inset:0;
    z-index:0;
    overflow:hidden;
    pointer-events:none;
  }
  .hero-bg svg{ position:absolute; inset:0; width:100%; height:100%; }

  .orb{
    position:absolute;
    border-radius:50%;
    filter:blur(50px);
    animation:orbFloat 9s ease-in-out infinite;
  }
  .orb-1{ width:340px; height:340px; top:-90px; left:-100px;
    background:radial-gradient(circle at 35% 35%, rgba(90,79,224,.35), rgba(90,79,224,0) 70%); }
  .orb-2{ width:280px; height:280px; bottom:-80px; right:-60px;
    background:radial-gradient(circle at 40% 40%, rgba(90,141,255,.30), rgba(90,141,255,0) 70%);
    animation-delay:-3s; }
  .orb-3{ width:180px; height:180px; top:12%; right:10%;
    background:radial-gradient(circle at 40% 40%, rgba(150,110,255,.25), rgba(150,110,255,0) 70%);
    animation-delay:-5.5s; }

  .glass{
    position:absolute;
    border-radius:22px;
    background:linear-gradient(135deg, rgba(255,255,255,.65), rgba(255,255,255,.15));
    border:1px solid rgba(255,255,255,.7);
    box-shadow:0 20px 40px -20px rgba(90,79,224,.25), inset 0 1px 0 rgba(255,255,255,.8);
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
    animation:panelFloat 7s ease-in-out infinite;
  }
  .glass-1{ width:96px; height:96px; top:9%; left:7%; transform:rotate(-14deg); animation-delay:-1s; }
  .glass-2{ width:64px; height:64px; top:20%; left:16%; border-radius:16px; transform:rotate(10deg); animation-delay:-3.4s; }
  .glass-3{ width:110px; height:110px; bottom:10%; right:8%; transform:rotate(16deg); animation-delay:-2.2s; }
  .glass-4{ width:56px; height:56px; bottom:22%; right:18%; border-radius:14px; transform:rotate(-8deg); animation-delay:-4.6s; }

  .cube{
    position:absolute;
    border-radius:10px;
    background:linear-gradient(135deg, rgba(90,79,224,.28), rgba(90,141,255,.10));
    border:1px solid rgba(90,79,224,.30);
    animation:panelFloat 8s ease-in-out infinite;
  }
  .cube-1{ width:20px; height:20px; top:32%; left:9%; animation-delay:-2s; }
  .cube-2{ width:14px; height:14px; bottom:30%; right:12%; animation-delay:-5s; }

  @keyframes orbFloat{
    0%,100%{ transform:translate(0,0) scale(1); }
    50%{ transform:translate(14px,-18px) scale(1.06); }
  }
  @keyframes panelFloat{
    0%,100%{ transform:translateY(0) rotate(var(--r,0deg)); }
    50%{ transform:translateY(-14px) rotate(var(--r,0deg)); }
  }
  @keyframes netPulse{
    0%,100%{ opacity:.28; }
    50%{ opacity:.6; }
  }
  @keyframes dashMove{
    to{ stroke-dashoffset:-240; }
  }
  @media (prefers-reduced-motion: reduce){
    .orb, .glass, .cube{ animation:none; }
    .hero-bg svg *{ animation:none !important; }
  }

  .wrap{
    position:relative;
    z-index:1;
    max-width:760px;
    width:100%;
    text-align:center;
  }
  .eyebrow{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:8px 16px;
    border:1px solid var(--border);
    background:var(--surface);
    border-radius:999px;
    font-family:'JetBrains Mono', monospace;
    font-size:13px;
    color:var(--muted);
    letter-spacing:.02em;
    margin-bottom:32px;
  }
  .eyebrow .dot{
    width:7px; height:7px; border-radius:50%;
    background:var(--whatsapp);
    box-shadow:0 0 0 3px rgba(34,197,94,.18);
  }
  h1{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:clamp(38px, 6.5vw, 64px);
    line-height:1.08;
    letter-spacing:-.02em;
  }
  .name-stage{
    perspective:900px;
    margin-top:10px;
  }
  h1 .name{
    display:block;
    margin:0;
    font-weight:700;
    letter-spacing:-.01em;
    background:linear-gradient(100deg, var(--text) 15%, var(--blue) 45%, var(--text) 75%);
    background-size:220% 100%;
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    filter:drop-shadow(0 14px 22px rgba(90,79,224,.20));
    transform-style:preserve-3d;
    will-change:transform;
    transition:transform .05s linear;
    animation:sheen 5s ease-in-out infinite;
  }
  @keyframes sheen{
    0%,100%{ background-position:0% 50%; }
    50%{ background-position:100% 50%; }
  }
  @media (prefers-reduced-motion: reduce){
    h1 .name{ animation:none; transition:none; transform:none !important; }
  }
  .role{
    font-family:'JetBrains Mono', monospace;
    color:var(--blue);
    font-size:15px;
    margin:20px 0 28px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
  }
  .role .bar{ width:26px; height:1px; background:var(--border); }
  .role a{
    color:inherit;
    text-decoration:none;
    border-bottom:1px solid transparent;
    transition:border-color .15s ease;
  }
  .role a:hover{ border-bottom-color:currentColor; }

  /* browser mock — signature element */
  .browser{
    margin:0 auto 32px;
    max-width:520px;
    border:1px solid var(--border);
    border-radius:12px;
    background:var(--surface);
    overflow:hidden;
    text-align:left;
    box-shadow:0 24px 48px -28px rgba(22,26,43,.18);
  }
  .browser-bar{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 14px;
    background:var(--surface-2);
    border-bottom:1px solid var(--border);
  }
  .browser-bar .traffic{ display:flex; gap:6px; }
  .browser-bar .traffic span{ width:9px; height:9px; border-radius:50%; background:#C7CBDC; }
  .browser-bar .url{
    flex:1;
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    color:var(--muted);
    background:var(--bg);
    border:1px solid var(--border);
    border-radius:6px;
    padding:5px 10px;
    text-align:center;
  }
  .browser-body{
    padding:20px 22px;
    font-family:'JetBrains Mono', monospace;
    font-size:13px;
    color:var(--muted);
    line-height:1.7;
  }
  .browser-body .txt{ color:var(--text); }
  .cursor{
    display:inline-block;
    width:7px; height:14px;
    background:var(--blue);
    margin-left:2px;
    animation:blink 1.1s step-end infinite;
    vertical-align:middle;
  }
  @keyframes blink{ 50%{ opacity:0; } }

  p.desc{
    color:var(--muted);
    font-size:16px;
    line-height:1.7;
    max-width:560px;
    margin:0 auto 40px;
  }
  p.desc b{ color:var(--text); font-weight:600; }

  .cta{
    display:flex;
    gap:14px;
    justify-content:center;
    flex-wrap:wrap;
    margin-bottom:36px;
  }
  .btn{
    display:inline-flex;
    align-items:center;
    gap:10px;
    padding:15px 26px;
    border-radius:10px;
    font-weight:600;
    font-size:15px;
    text-decoration:none;
    border:1px solid transparent;
    transition:transform .15s ease, box-shadow .15s ease;
    position:relative;
  }
  .btn:hover{ transform:translateY(-2px); }
  .btn svg{ width:18px; height:18px; flex-shrink:0; }
  .btn-phone{
    background:var(--blue);
    color:#FFFFFF;
    border-color:var(--blue);
    animation:pulse-blue 2.2s ease-out infinite;
  }
  .btn-phone:hover{ box-shadow:0 8px 24px -10px var(--blue-soft); }
  .btn-wa{
    background:var(--whatsapp);
    color:#FFFFFF;
    animation:pulse-green 2.2s ease-out infinite;
  }
  .btn-wa:hover{ box-shadow:0 8px 24px -10px rgba(34,197,94,.45); }

  @keyframes pulse-blue{
    0%{ box-shadow:0 0 0 0 rgba(90,79,224,.45); }
    70%{ box-shadow:0 0 0 14px rgba(90,79,224,0); }
    100%{ box-shadow:0 0 0 0 rgba(90,79,224,0); }
  }
  @keyframes pulse-green{
    0%{ box-shadow:0 0 0 0 rgba(34,197,94,.45); }
    70%{ box-shadow:0 0 0 14px rgba(34,197,94,0); }
    100%{ box-shadow:0 0 0 0 rgba(34,197,94,0); }
  }
  @media (prefers-reduced-motion: reduce){
    .btn-phone, .btn-wa{ animation:none; }
  }

  .trust{
    display:flex;
    gap:22px;
    justify-content:center;
    flex-wrap:wrap;
    font-size:13px;
    color:var(--muted);
  }
  .trust span{ display:flex; align-items:center; gap:7px; }
  .trust svg{ width:14px; height:14px; color:var(--whatsapp); flex-shrink:0; }

  @media (max-width:480px){
    .cta{ flex-direction:column; }
    .btn{ justify-content:center; width:100%; }
  }
</style>
</head>
<body>

  <script>
    var nameEl = document.getElementById('nameEl');
    var ticking = false;
    function applyTilt(){
      var y = window.scrollY || window.pageYOffset || 0;
      var progress = Math.max(-1, Math.min(1, y / 220));
      var rotateX = progress * -18;
      var rotateY = progress * 10;
      var translateZ = Math.abs(progress) * 30;
      nameEl.style.transform =
        'perspective(900px) rotateX(' + rotateX + 'deg) rotateY(' + rotateY + 'deg) translateZ(' + translateZ + 'px)';
      ticking = false;
    }
    window.addEventListener('scroll', function(){
      if(!ticking){
        window.requestAnimationFrame(applyTilt);
        ticking = true;
      }
    }, { passive: true });
    applyTilt();
  </script>

</html>
